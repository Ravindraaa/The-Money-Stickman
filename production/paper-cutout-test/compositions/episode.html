<template>
<style>
#root{position:absolute;inset:0;overflow:hidden;background:#e9e2d4}
canvas{width:100%;height:100%;display:block}
</style>
<div id="root" data-composition-id="episode"><canvas id="paperStage" width="540" height="960"></canvas></div>
<script src="vendor/paper.js"></script>
<script>
(() => {
 const canvas=document.getElementById('paperStage'),g=canvas.getContext('2d');
 const W=540,H=960,P=Paper;
 // Restrained palette: warm paper, charcoal ink, one muted ochre accent.
 const C={bg:'#e9e2d4',paper:'#f7f2e8',paper2:'#ded6c7',ink:'#252525',soft:'#5a554d',accent:'#b58b45',skin:'#d9cbb5'};
 const grain=P.grainTile(128,'money-stickman-paper-minimal',18);
 const cut=(pts,col,seed,o={})=>P.cutout(g,pts,col,seed,{border:3.5,borderVar:.45,jag:.75,step:2.6,shadow:.13,tex:{density:.48,len:[18,42],h:[2,5],alpha:[.12,.22]},...o});
 const text=(s,x,y,size,color=C.ink,align='center',weight='800')=>{g.save();g.font=weight+' '+size+'px Arial';g.textAlign=align;g.textBaseline='middle';g.fillStyle=color;g.fillText(s,x,y);g.restore()};
 const line=(pts,color=C.ink,w=3,seed='line')=>P.markerStroke(g,pts,color,w,seed,.85);
 function bg(){
   g.fillStyle=C.bg;g.fillRect(0,0,W,H);
   // One calm paper sheet, with a subtle edge shadow and fine grain.
   cut([[22,18],[518,22],[514,942],[25,938]],C.paper,'single-paper-sheet',{border:0,shadow:.08,tex:{density:.12,len:[28,60],h:[2,4],alpha:[.08,.13]}});
   g.save();g.globalAlpha=.045;g.globalCompositeOperation='multiply';g.drawImage(grain,22,18,W-44,H-36);g.restore();
 }
 function label(x,y,w,h,seed,rot=0){
   g.save();g.translate(x,y);g.rotate(rot);
   cut(P.roundRect(-w/2,-h/2,w,h,8),C.paper2,seed,{border:2.5,shadow:.1,tex:{density:.35,len:[15,34],h:[2,4],alpha:[.1,.18]}});
   g.restore();
 }
 function house(x,y,s){
   g.save();g.translate(x,y);g.scale(s,s);
   cut([[0,86],[145,-30],[290,86],[278,270],[12,270]],C.paper2,'house-body',{border:5});
   cut([[0,86],[145,-42],[290,86],[269,103],[145,-14],[20,103]],C.ink,'house-roof',{border:3,tex:{density:.2,len:[20,42],h:[2,4],alpha:[.08,.16]}});
   cut(P.roundRect(113,151,64,119,5),C.accent,'house-door',{border:3});
   cut(P.roundRect(32,130,56,54,4),C.paper,'house-window-a',{border:3});
   cut(P.roundRect(202,130,56,54,4),C.paper,'house-window-b',{border:3});
   line([[145,-12],[145,72]],C.paper,2,'roof-seam');
   g.restore();
 }
 function person(x,y,s,phase=0){
   g.save();g.translate(x,y);g.scale(s,s);
   // Soft grounded shadow; all pieces stay in paper/ink tones.
   g.globalAlpha=.12;g.fillStyle=C.ink;g.beginPath();g.ellipse(0,8,62,12,0,0,Math.PI*2);g.fill();g.globalAlpha=1;
   cut(P.ellipse(0,-142,42,49),C.paper2,'person-head',{border:4});
   // Simple eyes and expression, hand-marked.
   g.fillStyle=C.ink;g.beginPath();g.arc(-14,-151,3.6,0,Math.PI*2);g.arc(14,-151,3.6,0,Math.PI*2);g.fill();
   line([[-12,-125],[0,-120],[12,-125]],C.ink,2.3,'person-smile');
   cut(P.noodle([[0,-92],[0,-8]],19,16),C.ink,'person-body',{border:3});
   const swing=Math.sin(phase*2.5)*8;
   cut(P.noodle([[-2,-72],[-39,-38],[-65,-52-swing]],13,10),C.ink,'person-arm-left',{border:2.5});
   cut(P.noodle([[2,-72],[39,-38],[67,-54+swing]],13,10),C.ink,'person-arm-right',{border:2.5});
   cut(P.noodle([[-1,-8],[-27,42],[-37,92]],15,11),C.ink,'person-leg-left',{border:2.5});
   cut(P.noodle([[1,-8],[28,42],[39,92]],15,11),C.ink,'person-leg-right',{border:2.5});
   // Small ochre sleeve tabs make the figure memorable without adding extra colors.
   cut(P.noodle([[-42,-40-swing],[-51,-50-swing]],8,6),C.accent,'sleeve-left',{border:1.5});
   cut(P.noodle([[42,-40+swing],[52,-52+swing]],8,6),C.accent,'sleeve-right',{border:1.5});
   g.restore();
 }
 function dollar(x,y,s,rot,seed){
   g.save();g.translate(x,y);g.rotate(rot);g.scale(s,s);
   cut(P.roundRect(-92,-48,184,96,8),C.paper2,seed,{border:4,tex:{density:.42,len:[14,32],h:[2,4],alpha:[.12,.2]}});
   cut(P.ellipse(0,0,27,27),C.accent,seed+'-seal',{border:2.5,tex:{density:.25,len:[10,22],h:[2,3]}});
   text('$',0,1,34,C.ink);
   line([[-70,-25],[-46,-25]],C.ink,2,seed+'-a');line([[46,25],[70,25]],C.ink,2,seed+'-b');
   g.restore();
 }
 function draw(t){
   g.clearRect(0,0,W,H);bg();
   const ease=v=>{v=Math.max(0,Math.min(1,v));return 1-Math.pow(1-v,3)};
   const enter=(a,b)=>ease((t-a)/(b-a));
   if(t<2){
     const p=enter(0,.55);
     g.save();g.translate(0,(1-p)*55);
     text('THE 7% MORTGAGE TRAP',270,112,29,C.ink);
     line([[94,150],[446,150]],C.accent,4,'headline-rule');
     house(65,355,1.02);
     person(405,710,1.03,t);
     label(270,835,360,68,'hook-note',-.018);
     text('WHY DOES BUYING STILL FEEL',270,824,18,C.soft);
     text('SO EXPENSIVE?',270,849,23,C.ink);
     g.restore();
   }else if(t<4){
     const p=enter(2,2.45);
     g.save();g.translate((1-p)*50,0);
     text('THE LATEST RATE',270,118,23,C.soft);
     text('7.11%',270,260,116,C.accent);
     label(270,365,300,78,'rate-label',.012);
     text('30-YEAR FIXED',270,365,27,C.ink);
     house(40,590,.66);
     dollar(340,635,.88,-.08,'rate-dollar');
     person(420,825,.62,t);
     g.restore();
   }else{
     const p=enter(4,4.45);
     g.save();g.translate(0,(1-p)*40);
     text('THE COST ADDS UP',270,116,26,C.soft);
     label(270,330,380,176,'annual-cost',-.012);
     text('$3,600',270,300,82,C.accent);
     text('MORE PER YEAR*',270,365,26,C.ink);
     dollar(145,640,.74,-.12,'annual-bill-a');
     dollar(385,700,.66,.1,'annual-bill-b');
     person(270,845,.72,t);
     text('*ILLUSTRATIVE LOAN COMPARISON',270,918,15,C.soft);
     g.restore();
   }
 }
 const clock={t:0};
 const tl=gsap.timeline({paused:true});
 tl.to(clock,{t:6,duration:6,ease:'none',onUpdate:()=>draw(clock.t)});
 tl.call(()=>draw(6),[],6);
 draw(0);
 window.__timelines=window.__timelines||{};window.__timelines.episode=tl;
})();
</script>
</template>
