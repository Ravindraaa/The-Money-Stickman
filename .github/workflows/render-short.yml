name: Render The Money Stickman Short

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate local narration with Kokoro
        run: python scripts/generate_voice.py
      - name: Render MP4
        run: python render_short.py
      - name: Upload rendered MP4
        uses: actions/upload-artifact@v4
        with:
          name: the-money-stickman-short-001
          path: output/first_1000_short.mp4
          if-no-files-found: error
          retention-days: 7
