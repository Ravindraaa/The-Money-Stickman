name: Render Short 11 — Mortgage Rate Shock
on:
  push:
    branches: [engine-v2-foundation]
    paths:
      - 'production/short-11-mortgage-rate-shock/**'
      - '.github/workflows/render-short-11-mortgage-rate-shock.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install browser and render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm install --global hyperframes
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Prepare GSAP
        run: |
          mkdir -p production/short-11-mortgage-rate-shock/vendor
          cp production/vendor/gsap.min.js production/short-11-mortgage-rate-shock/vendor/gsap.min.js
      - name: Capture compact source evidence cards
        working-directory: production/short-11-mortgage-rate-shock
        run: node scripts/capture_sources.mjs
      - name: Validate composition
        working-directory: production/short-11-mortgage-rate-shock
        run: hyperframes check --json
      - name: Render 40-second explainer
        working-directory: production/short-11-mortgage-rate-shock
        run: hyperframes render
      - name: Install Voice B dependencies
        run: |
          python -m pip install --upgrade pip
          pip install chatterbox-tts soundfile
      - name: Generate US English narration
        working-directory: production/short-11-mortgage-rate-shock
        run: python scripts/generate_voice.py
      - name: Slow narration to 0.9x and mux
        working-directory: production/short-11-mortgage-rate-shock
        run: |
          mkdir -p final
          VIDEO="$(find renders -maxdepth 1 -type f -name '*.mp4' | head -n 1)"
          test -n "$VIDEO"
          ffmpeg -y -i voice-original.wav -filter:a "atempo=0.9" voice.wav
          V="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$VIDEO")"
          A="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 voice.wav)"
          python -c "v=float('$V'); a=float('$A'); print(f'Video {v:.2f}s | 0.9x voice {a:.2f}s'); assert v >= 38 and 28.0 <= a <= 43.0"
          ffmpeg -y -i "$VIDEO" -i voice.wav -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k -shortest -movflags +faststart final/money-stickman-mortgage-rate-shock-40s.mp4
          ffprobe -v error -show_entries format=duration:stream=width,height,codec_name -of json final/money-stickman-mortgage-rate-shock-40s.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: money-stickman-mortgage-rate-shock-40s
          path: |
            production/short-11-mortgage-rate-shock/final/money-stickman-mortgage-rate-shock-40s.mp4
            production/short-11-mortgage-rate-shock/voice.wav
            production/short-11-mortgage-rate-shock/compositions/assets/*.png
          retention-days: 7
