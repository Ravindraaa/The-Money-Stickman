name: Render Short 13 — First $1,000
on:
  push:
    branches: [engine-v2-foundation]
    paths:
      - 'production/short-13-first-1000/**'
      - '.github/workflows/render-short-13-first-1000.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm install --global hyperframes
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Prepare GSAP
        run: |
          mkdir -p production/short-13-first-1000/vendor
          cp production/vendor/gsap.min.js production/short-13-first-1000/vendor/gsap.min.js
      - name: Validate composition
        working-directory: production/short-13-first-1000
        run: hyperframes check --json
      - name: Render 40-second animation
        working-directory: production/short-13-first-1000
        env:
          HYPERFRAMES_BROWSER_PATH: /usr/bin/google-chrome
        run: hyperframes render
      - name: Install Voice B dependencies
        run: |
          python -m pip install --upgrade pip
          pip install chatterbox-tts soundfile
      - name: Generate US English narration
        working-directory: production/short-13-first-1000
        run: python scripts/generate_voice.py
      - name: Mux narration and validate duration
        working-directory: production/short-13-first-1000
        run: |
          mkdir -p final
          VIDEO="$(find renders -maxdepth 1 -type f -name '*.mp4' | head -n 1)"
          test -n "$VIDEO"
          ffmpeg -y -i voice-original.wav -filter:a "atempo=0.96" voice.wav
          V="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$VIDEO")"
          A="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 voice.wav)"
          python -c "v=float('$V'); a=float('$A'); print(f'Video {v:.2f}s | voice {a:.2f}s'); assert v >= 39 and 32 <= a <= 43"
          ffmpeg -y -i "$VIDEO" -i voice.wav -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k -shortest -movflags +faststart final/money-stickman-first-1000-40s.mp4
          ffprobe -v error -show_entries format=duration:stream=width,height,codec_name -of json final/money-stickman-first-1000-40s.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: money-stickman-first-1000-40s
          path: |
            production/short-13-first-1000/final/money-stickman-first-1000-40s.mp4
            production/short-13-first-1000/voice.wav
          retention-days: 7
