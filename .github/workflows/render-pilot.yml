name: Render The Money Stickman Pilot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Blender and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg
      - name: Install voice dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate energetic American voice
        run: python pilot/pilot_voice.py
      - name: Render cinematic 3D pilot
        run: blender -b -t 2 --python pilot/pilot_scene.py
      - name: Mix adaptive music and voice
        run: python pilot/mix_audio.py
      - name: Assemble vertical MP4
        run: |
          ffmpeg -y -framerate 30 -i output/pilot_frame_%04d.png -i output/pilot_mix.wav \
            -vf "scale=1080:1920:flags=lanczos,format=yuv420p" -c:v libx264 -preset veryfast \
            -crf 20 -c:a aac -b:a 192k -shortest -movflags +faststart output/stickman_pilot_5s.mp4
      - name: Upload pilot MP4
        uses: actions/upload-artifact@v4
        with:
          name: the-money-stickman-pilot
          path: output/stickman_pilot_5s.mp4
          if-no-files-found: error
          retention-days: 7
