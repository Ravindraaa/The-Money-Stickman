name: Render Short 07 — Simple 2D Demo
on:
  push:
    branches: [engine-v2-foundation]
    paths:
      - 'production/short-07-simple2d/**'
      - '.github/workflows/render-short-07-simple2d.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Cache TTS model
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
            ~/.cache/torch
          key: money-stickman-simple2d-voice-v1
      - name: Install FFmpeg and HyperFrames
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm install --global hyperframes
      - name: Prepare GSAP
        run: |
          mkdir -p production/short-07-simple2d/vendor
          cp production/vendor/gsap.min.js production/short-07-simple2d/vendor/gsap.min.js
      - name: Validate composition
        working-directory: production/short-07-simple2d
        run: hyperframes check --json
      - name: Render 10-second 2D explainer
        working-directory: production/short-07-simple2d
        run: hyperframes render
      - name: Install Voice B dependencies
        run: |
          python -m pip install --upgrade pip
          pip install chatterbox-tts soundfile
      - name: Generate narration
        working-directory: production/short-07-simple2d
        run: python scripts/generate_voice.py
      - name: Mux voice and video
        working-directory: production/short-07-simple2d
        run: |
          mkdir -p final
          VIDEO="$(find renders -maxdepth 1 -type f -name '*.mp4' | head -n 1)"
          test -n "$VIDEO"
          V="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$VIDEO")"
          A="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 demo-voice.wav)"
          python -c "v=float('$V'); a=float('$A'); print(f'Video {v:.2f}s | Voice {a:.2f}s'); assert v >= 10 and 7.0 <= a <= 10.8"
          ffmpeg -y -i "$VIDEO" -i demo-voice.wav -filter_complex "[1:a]loudnorm=I=-16:TP=-1.5:LRA=11,apad,atrim=0:10,afade=t=out:st=9.4:d=0.6[a]" -map 0:v:0 -map "[a]" -c:v copy -c:a aac -b:a 192k -t 10 -movflags +faststart final/money-stickman-simple2d-10s.mp4
          ffprobe -v error -show_entries format=duration:stream=width,height,codec_name -of json final/money-stickman-simple2d-10s.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: money-stickman-simple2d-10s
          path: |
            production/short-07-simple2d/final/money-stickman-simple2d-10s.mp4
            production/short-07-simple2d/demo-voice.wav
          retention-days: 7