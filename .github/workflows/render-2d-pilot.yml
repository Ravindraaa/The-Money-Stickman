name: Render Money Stickman Short 01
on:
  workflow_dispatch:
  push:
    paths:
      - 'production/**'
      - '.github/workflows/render-2d-pilot.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install HyperFrames and GSAP
        run: |
          npm install --global hyperframes
          npm install --prefix production gsap
      - name: Validate composition
        working-directory: production
        run: hyperframes check --json
      - name: Render visual timeline
        working-directory: production
        run: hyperframes render
      - name: Install narration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install chatterbox-tts soundfile
      - name: Generate approved Voice B narration
        working-directory: production
        run: python scripts/generate_short_01_voice.py
      - name: Mux narration into 32-second final vertical MP4
        working-directory: production
        run: |
          mkdir -p final
          VIDEO="$(find renders -maxdepth 1 -type f -name '*.mp4' | head -n 1)"
          test -n "$VIDEO"
          DURATION="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$VIDEO")"
          python -c "d=float('$DURATION'); print(f'Visual render duration: {d:.2f}s'); assert d >= 32, 'Visual render must be at least 32 seconds'"
          ffmpeg -y -i "$VIDEO" -i short-01-voice.wav -filter_complex "[1:a]atempo=0.82,loudnorm=I=-16:TP=-1.5:LRA=11,apad,atrim=0:32,afade=t=out:st=31:d=1[voice]" -map 0:v:0 -map "[voice]" -c:v copy -c:a aac -b:a 192k -t 32 -movflags +faststart final/the-money-stickman-short-01.mp4
          ffprobe -v error -show_entries format=duration:stream=codec_name,width,height -of json final/the-money-stickman-short-01.mp4
      - name: Upload review MP4 and narration
        uses: actions/upload-artifact@v4
        with:
          name: money-stickman-short-01-review
          path: |
            production/final/the-money-stickman-short-01.mp4
            production/short-01-voice.wav
          if-no-files-found: error
          retention-days: 7
