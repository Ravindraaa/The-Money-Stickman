name: Render Text + Draw Motion Pilot
on:
  push:
    branches: [text-draw-motion-pilot]
    paths:
      - 'production/text-draw/**'
      - '.github/workflows/render-text-draw-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install HyperFrames
        run: npm install --global hyperframes
      - name: Generate voiceover in six scene-matched chunks
        working-directory: production/text-draw
        run: |
          python -m pip install --user edge-tts
          TTS="$HOME/.local/bin/edge-tts"
          "$TTS" --voice en-US-AndrewMultilingualNeural --rate=+5% --text "Why is your first one thousand dollars so hard to save? It isn't just your income. It's the system you're stuck in." --write-media voice_1.mp3
          "$TTS" --voice en-US-AndrewMultilingualNeural --rate=+5% --text "You get paid, you feel rich. Then rent, food, transport, and bills take their turn. Your money already has too many jobs." --write-media voice_2.mp3
          "$TTS" --voice en-US-AndrewMultilingualNeural --rate=+5% --text "A little takeout here. A subscription there. A rideshare. A random buy. Small spends quietly do big damage." --write-media voice_3.mp3
          "$TTS" --voice en-US-AndrewMultilingualNeural --rate=+5% --text "Then life happens. One surprise expense, like a car repair, can wipe out what you saved. Without a buffer, you start from zero again." --write-media voice_4.mp3
          "$TTS" --voice en-US-AndrewMultilingualNeural --rate=+5% --text "Flip the order. Save first, spend second. Start with twenty-five dollars every payday and automate it. Build the habit, then build your first one thousand." --write-media voice_5.mp3
          "$TTS" --voice en-US-AndrewMultilingualNeural --rate=+5% --text "A thousand dollars in the bank means less panic. What's the hardest part of saving for you?" --write-media voice_6.mp3
          printf "file 'voice_1.mp3'\nfile 'voice_2.mp3'\nfile 'voice_3.mp3'\nfile 'voice_4.mp3'\nfile 'voice_5.mp3'\nfile 'voice_6.mp3'\n" > voice_list.txt
          ffmpeg -y -f concat -safe 0 -i voice_list.txt -c copy narration.mp3
          python sync_timeline.py
      - name: Validate composition
        working-directory: production/text-draw
        run: hyperframes check --json
      - name: Render visual timeline
        working-directory: production/text-draw
        run: hyperframes render
      - name: Verify and mux MP4 with narration
        working-directory: production/text-draw
        run: |
          set -euo pipefail
          VIDEO="$(find renders -maxdepth 1 -type f -name '*.mp4' | sort | tail -n 1)"
          test -n "$VIDEO"
          VIDEO_DURATION="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$VIDEO")"
          AUDIO_DURATION="$(ffprobe -v error -show_entries format=duration -of csv=p=0 narration.mp3)"
          python - "$VIDEO_DURATION" "$AUDIO_DURATION" <<'PY'
          import sys
          v, a = map(float, sys.argv[1:])
          print(f"Visual render: {v:.2f}s | Narration: {a:.2f}s")
          if v + 0.25 < a:
              raise SystemExit("FAIL: visual timeline ends before narration")
          if a < 20:
              raise SystemExit("FAIL: narration is unexpectedly short")
          PY
          mkdir -p final
          ffmpeg -y -i "$VIDEO" -i narration.mp3 -map 0:v:0 -map 1:a:0 -c:v libx264 -preset veryfast -crf 18 -pix_fmt yuv420p -c:a aac -b:a 192k -af "loudnorm=I=-16:TP=-1.5:LRA=11" -t "$AUDIO_DURATION" -movflags +faststart final/text-draw-motion-pilot.mp4
          FINAL_VIDEO="$(ffprobe -v error -select_streams v:0 -show_entries stream=duration -of csv=p=0 final/text-draw-motion-pilot.mp4)"
          FINAL_AUDIO="$(ffprobe -v error -select_streams a:0 -show_entries stream=duration -of csv=p=0 final/text-draw-motion-pilot.mp4)"
          python - "$FINAL_VIDEO" "$FINAL_AUDIO" <<'PY'
          import sys
          v, a = map(float, sys.argv[1:])
          print(f"FINAL VIDEO={v:.2f}s AUDIO={a:.2f}s")
          if abs(v-a) > 0.35:
              raise SystemExit("FAIL: final audio/video durations are not aligned")
          PY
      - name: Upload review render
        uses: actions/upload-artifact@v4
        with:
          name: text-draw-motion-pilot
          path: production/text-draw/final/text-draw-motion-pilot.mp4
          if-no-files-found: error
          retention-days: 7
