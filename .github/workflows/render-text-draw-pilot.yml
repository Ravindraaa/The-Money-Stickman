name: Render Text + Draw Motion Pilot
on:
  push:
    branches: [text-draw-motion-pilot]
    paths:
      - 'production/text-draw/**'
      - '.github/workflows/render-text-draw-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install HyperFrames
        run: npm install --global hyperframes
      - name: Validate composition
        working-directory: production/text-draw
        run: hyperframes check --json
      - name: Render visual timeline
        working-directory: production/text-draw
        run: hyperframes render
      - name: Generate US English voiceover
        working-directory: production/text-draw
        run: |
          python -m pip install --user edge-tts
          ~/.local/bin/edge-tts --voice en-US-AndrewMultilingualNeural --rate=+5% --text "You make seventy thousand dollars a year… and you're still broke. Here's why. Your paycheck looks big, but after taxes, you're taking home much less. Then comes rent. A car payment. Insurance. Groceries. Credit card bills. Suddenly, your money is already gone before the next paycheck arrives. And here's the trap: every time you earn more, you upgrade your lifestyle. A nicer car. A bigger apartment. More subscriptions. Want to break the cycle? Stop increasing your spending every time your income increases. Pay yourself first. Automate your savings. And give every dollar a job. What's eating your paycheck?" --write-media narration.mp3
      - name: Verify and mux MP4 with narration
        working-directory: production/text-draw
        run: |
          VIDEO="$(find renders -maxdepth 1 -type f -name '*.mp4' | head -n 1)"
          test -n "$VIDEO"
          mkdir -p final
          ffmpeg -y -i "$VIDEO" -i narration.mp3 -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k -af "loudnorm=I=-16:TP=-1.5:LRA=11" -shortest final/text-draw-motion-pilot.mp4
          ffprobe -v error -show_entries format=duration:stream=codec_name,width,height -of json final/text-draw-motion-pilot.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 final/text-draw-motion-pilot.mp4 | grep -q aac
      - name: Upload review render
        uses: actions/upload-artifact@v4
        with:
          name: text-draw-motion-pilot
          path: production/text-draw/final/text-draw-motion-pilot.mp4
          if-no-files-found: error
          retention-days: 7
