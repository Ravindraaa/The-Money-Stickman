name: Render Short 06 — 10s 3D Explainer Preview
on:
  push:
    branches: [engine-v2-foundation]
    paths:
      - 'production/short-06-preview10/**'
      - '.github/workflows/render-short-06-preview10.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Cache TTS model
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
            ~/.cache/torch
          key: money-stickman-preview10-voice-v1
      - name: Install FFmpeg and HyperFrames
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm install --global hyperframes
      - name: Prepare GSAP
        run: |
          mkdir -p production/short-06-preview10/vendor
          cp production/vendor/gsap.min.js production/short-06-preview10/vendor/gsap.min.js
      - name: Validate 10-second composition
        working-directory: production/short-06-preview10
        run: hyperframes check --json
      - name: Render 3D-style explainer
        working-directory: production/short-06-preview10
        run: hyperframes render
      - name: Install Voice B dependencies
        run: |
          python -m pip install --upgrade pip
          pip install chatterbox-tts soundfile
      - name: Generate narration
        working-directory: production/short-06-preview10
        run: python scripts/generate_voice.py
      - name: Mux voice and video
        working-directory: production/short-06-preview10
        run: |
          mkdir -p final
          VIDEO="$(find renders -maxdepth 1 -type f -name '*.mp4' | head -n 1)"
          test -n "$VIDEO"
          V="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$VIDEO")"
          A="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 preview-voice.wav)"
          python -c "v=float('$V'); a=float('$A'); print(f'Video {v:.2f}s | Voice {a:.2f}s'); assert v >= 10 and 7.5 <= a <= 11.5"
          ffmpeg -y -i "$VIDEO" -i preview-voice.wav -filter_complex "[1:a]loudnorm=I=-16:TP=-1.5:LRA=11,apad,atrim=0:10,afade=t=out:st=9.4:d=0.6[a]" -map 0:v:0 -map "[a]" -c:v copy -c:a aac -b:a 192k -t 10 -movflags +faststart final/short06-3d-preview-10s.mp4
          ffprobe -v error -show_entries format=duration:stream=width,height,codec_name -of json final/short06-3d-preview-10s.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: short06-3d-preview-10s
          path: |
            production/short-06-preview10/final/short06-3d-preview-10s.mp4
            production/short-06-preview10/preview-voice.wav
          retention-days: 7
