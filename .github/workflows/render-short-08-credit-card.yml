name: Render Short 08 — Credit Card Minimum Payment
on:
  push:
    branches: [engine-v2-foundation]
    paths:
      - 'production/short-08-credit-card/**'
      - '.github/workflows/render-short-08-credit-card.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Cache TTS model
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
            ~/.cache/torch
          key: money-stickman-credit-card-voice-v1
      - name: Install FFmpeg and HyperFrames
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm install --global hyperframes
      - name: Prepare GSAP
        run: |
          mkdir -p production/short-08-credit-card/vendor
          cp production/vendor/gsap.min.js production/short-08-credit-card/vendor/gsap.min.js
      - name: Validate composition
        working-directory: production/short-08-credit-card
        run: hyperframes check --json
      - name: Render 40-second explainer
        working-directory: production/short-08-credit-card
        run: hyperframes render
      - name: Install Voice B dependencies
        run: |
          python -m pip install --upgrade pip
          pip install chatterbox-tts soundfile
      - name: Generate narration
        working-directory: production/short-08-credit-card
        run: python scripts/generate_voice.py
      - name: Mux voice and video
        working-directory: production/short-08-credit-card
        run: |
          mkdir -p final
          VIDEO="$(find renders -maxdepth 1 -type f -name '*.mp4' | head -n 1)"
          test -n "$VIDEO"
          V="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$VIDEO")"
          A="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 voice.wav)"
          python -c "v=float('$V'); a=float('$A'); print(f'Video {v:.2f}s | Voice {a:.2f}s'); assert v >= 35 and 28.0 <= a <= 45.0"
          ffmpeg -y -i "$VIDEO" -i voice.wav -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k -shortest -movflags +faststart final/money-stickman-credit-card-40s.mp4
          ffprobe -v error -show_entries format=duration:stream=width,height,codec_name -of json final/money-stickman-credit-card-40s.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: money-stickman-credit-card-40s
          path: |
            production/short-08-credit-card/final/money-stickman-credit-card-40s.mp4
            production/short-08-credit-card/voice.wav
          retention-days: 7
